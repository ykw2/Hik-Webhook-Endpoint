{% extends "base.html" %}
{% block title %}登入 · 海康事件{% endblock %}
{% block content %}
<form class="card" method="post" action="/login">
  <h1>登入</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label for="password">密碼</label>
  <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" spellcheck="false">
  <button type="submit">登入</button>
</form>
{% endblock %}
