<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}承.事件{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=16">
  {% if authed %}<meta name="csrf" content="{{ csrf }}">{% endif %}
</head>
<body>
  {% block lead %}{% endblock %}
  {% if authed %}
  <header class="top">
    <a class="brand" href="/events" aria-label="承">
      <span class="mark">承</span>
    </a>
    <nav>
      <a href="/events">事件</a>
      <a class="manage" href="/manage">管理</a>
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">登出</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <div class="stripe"></div>
  {% block under %}{% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="zoom" hidden>
    <img alt="">
  </div>
  <script>
    (function () {
      var layer = document.getElementById("zoom");
      var full = layer.querySelector("img");
      function closeZoom() {
        layer.hidden = true;
        full.removeAttribute("src");
      }
      document.addEventListener("click", function (event) {
        if (!layer.hidden) {
          closeZoom();
          return;
        }
        var shot = event.target.closest("img.zoomable");
        if (!shot) return;
        full.src = shot.currentSrc || shot.src;
        full.alt = shot.alt || "";
        layer.hidden = false;
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !layer.hidden) closeZoom();
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
