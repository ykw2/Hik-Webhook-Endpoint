<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}海康事件{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
  {% if authed %}<meta name="csrf" content="{{ csrf }}">{% endif %}
</head>
<body>
  {% block lead %}{% endblock %}
  {% if authed %}
  <header class="top">
    <a class="brand" href="/events" aria-label="承">
      <span class="mark">承</span>
    </a>
    <nav>
      <a href="/events">事件</a>
      <a class="manage" href="/manage">管理</a>
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">登出</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <div class="stripe"></div>
  {% block under %}{% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
